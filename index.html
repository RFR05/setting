<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="설정">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#000000" id="themeColor">
<!-- 홈 화면 아이콘: 같은 폴더의 icon.png (180x180). 바꾸고 싶으면 같은 이름으로 덮어쓰면 돼요 -->
<link rel="apple-touch-icon" href="icon.png">
<title>설정</title>
<style>
:root{--bg:#F2F2F7;--sidebg:linear-gradient(180deg,#F8F8FA 0%,#EFEFF3 100%);--card:#fff;--text:#000;--sub:#6C6C70;--hdr:#6C6C70;--sep:rgba(60,60,67,.2);--chev:#B4B4B9;--press:rgba(120,120,128,.18);--sel:rgba(120,120,128,.16);--blue:#007AFF;--green:#34C759;--red:#FF3B30;--off:rgba(120,120,128,.2);--field:rgba(120,120,128,.1);--fieldb:rgba(0,0,0,.04);--glass:rgba(255,255,255,.75);--glassb:rgba(0,0,0,.06);--bar:rgba(242,242,247,.8);--bar1:#D1D1D6;--bar2:#8E8E93;--radius:26px;--sidew:clamp(300px,39vw,400px)}
html.dark{--bg:#000;--sidebg:linear-gradient(180deg,#282C32 0%,#1F2227 45%,#1A1C20 100%);--card:#1C1C1E;--text:#fff;--sub:#98989F;--hdr:#98989F;--sep:rgba(84,84,88,.55);--chev:#5B5B60;--press:rgba(255,255,255,.08);--sel:rgba(255,255,255,.1);--blue:#0A84FF;--green:#30D158;--red:#FF453A;--off:rgba(120,120,128,.36);--field:rgba(255,255,255,.07);--fieldb:rgba(255,255,255,.12);--glass:rgba(44,44,48,.75);--glassb:rgba(255,255,255,.12);--bar:rgba(0,0,0,.6);--bar1:#3A3A3C;--bar2:#636366}
@media (prefers-color-scheme:dark){html.auto{--bg:#000;--sidebg:linear-gradient(180deg,#282C32 0%,#1F2227 45%,#1A1C20 100%);--card:#1C1C1E;--text:#fff;--sub:#98989F;--hdr:#98989F;--sep:rgba(84,84,88,.55);--chev:#5B5B60;--press:rgba(255,255,255,.08);--sel:rgba(255,255,255,.1);--blue:#0A84FF;--green:#30D158;--red:#FF453A;--off:rgba(120,120,128,.36);--field:rgba(255,255,255,.07);--fieldb:rgba(255,255,255,.12);--glass:rgba(44,44,48,.75);--glassb:rgba(255,255,255,.12);--bar:rgba(0,0,0,.6);--bar1:#3A3A3C;--bar2:#636366}}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;margin:0;padding:0;text-align:inherit}

/* 화면 배치: 좁으면(폰) 밀어서 들어가기, 넓으면(아이패드) 왼쪽 목록 + 오른쪽 화면 */
.app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.pane{position:absolute;top:0;bottom:0;left:0;width:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);transition:transform .45s cubic-bezier(.32,.72,0,1)}
.list{padding:0 calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 40px) calc(env(safe-area-inset-left) + 16px)}
.detail{transform:translateX(100%);padding:0 calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 48px) calc(env(safe-area-inset-left) + 20px)}
.app.open .list{transform:translateX(-30%)}
.app.open .detail{transform:none}
.app.dragging .pane{transition:none}

/* 왼쪽 목록 */
.lnav{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:center;height:calc(env(safe-area-inset-top) + 50px);padding-top:env(safe-area-inset-top);margin:0 calc(-16px - env(safe-area-inset-right)) 0 calc(-16px - env(safe-area-inset-left));transition:background-color .2s}
.lnav.scrolled{background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.lnt{font-size:17px;font-weight:600;opacity:0;transition:opacity .2s}
.lnav.scrolled .lnt{opacity:1}
h1{margin:0 0 12px 4px;font-size:34px;font-weight:700;letter-spacing:.3px}
.shead{margin-bottom:22px}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 14px;border-radius:22px;background:var(--field);box-shadow:inset 0 0 0 1px var(--fieldb);color:var(--sub)}
.search>svg,.smic svg{flex:none;width:20px;height:20px}
.search input{flex:1;min-width:0;height:100%;padding:0;border:0;outline:0;background:transparent;font:inherit;font-size:17px;color:var(--text);-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--sub)}
.search input::-webkit-search-cancel-button{display:none}
.smic{display:flex;color:var(--sub)}
.sclear{display:none;width:24px;height:24px;align-items:center;justify-content:center;color:var(--sub);cursor:pointer}
.sclear svg{width:20px;height:20px}
.search.has .sclear{display:flex}
.search.has .smic{display:none}
.groups{display:flex;flex-direction:column;gap:28px}
.groups[hidden],#results[hidden]{display:none}
.c{background:var(--card);border-radius:var(--radius);overflow:hidden}
.r{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 16px;text-align:left;cursor:pointer}
.r:active{background:var(--press)}
.r.x,.r.x:active{background:none;cursor:default}
.c .r+.r::before{content:"";position:absolute;top:0;left:58px;right:16px;height:.5px;background:var(--sep)}
.rl{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv{font-size:17px;color:var(--sub);white-space:nowrap}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf .r{min-height:84px}
.pn{font-size:19px;font-weight:600;letter-spacing:-.2px}
.ps{font-size:14px;color:var(--sub)}
.nores{padding:40px 20px;text-align:center;font-size:17px;color:var(--sub)}
.chev{flex:none;width:8px;height:8px;margin:0 4px 0 2px;border-top:2px solid var(--chev);border-right:2px solid var(--chev);transform:rotate(45deg)}

/* 아이콘 칸 */
.i{flex:none;position:relative;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16)}
.i svg{width:18px;height:18px}
.i .tx{font-size:11px;font-weight:700;letter-spacing:-.2px;line-height:1}
.i.lg{width:60px;height:60px;border-radius:14px}
.i.lg svg{width:38px;height:38px}
.i.lg .tx{font-size:22px}
.av{flex:none;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(180deg,#A9B1E2,#6F78B9)}
.av.lg{width:88px;height:88px;font-size:32px}

/* 스위치 (눌러도 안 바뀜) */
.tg{flex:none;position:relative;width:62px;height:28px;border-radius:14px;background:var(--off)}
.tg i{position:absolute;top:2px;left:2px;width:38px;height:24px;border-radius:12px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tg.on{background:var(--green)}
.tg.on i{left:22px}

/* 오른쪽 화면 */
.dnav{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;height:calc(env(safe-area-inset-top) + 56px);padding:env(safe-area-inset-top) calc(env(safe-area-inset-right) + 16px) 0 calc(env(safe-area-inset-left) + 16px);margin:0 calc(-20px - env(safe-area-inset-right)) 0 calc(-20px - env(safe-area-inset-left))}
.dnav::before{content:"";position:absolute;inset:0 0 -24px;background:var(--bar);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent);opacity:0;transition:opacity .2s;pointer-events:none}
.dnav.scrolled::before{opacity:1}
.dt{position:absolute;left:120px;right:120px;bottom:0;height:56px;margin:0;line-height:56px;text-align:center;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s;pointer-events:none}
.dnav.titled .dt,.dnav.fixed .dt{opacity:1}
.gbtn{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;height:44px;min-width:44px;padding:0 18px;border-radius:22px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--glassb),0 6px 16px rgba(0,0,0,.12);-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);font-size:17px;font-weight:600;cursor:pointer}
.gbtn:active{transform:scale(.94)}
.back{width:44px;padding:0}
.back svg{width:12px;height:20px}
.dcontent{max-width:900px;margin:24px auto 0}
.dcontent.anim-push{animation:push .34s cubic-bezier(.32,.72,0,1)}
.dcontent.anim-pop{animation:pop .34s cubic-bezier(.32,.72,0,1)}
@keyframes push{from{transform:translateX(36px);opacity:0}}
@keyframes pop{from{transform:translateX(-36px);opacity:0}}
.sec{margin-top:36px}
.sec:first-child{margin-top:0}
.card{position:relative;background:var(--card);border-radius:var(--radius);overflow:hidden}
.sh{display:flex;align-items:center;gap:10px;margin:0 20px 10px;font-size:17px;font-weight:600;color:var(--hdr)}
.foot{margin:10px 20px 0;font-size:14px;line-height:1.4;color:var(--sub)}
.foot p{margin:0 0 14px;white-space:pre-line}
.foot p:last-child{margin:0}
.lnk{color:var(--blue)}
.dng{color:var(--red)}
.hero .hh{padding:20px 20px 18px}
.hero .ht{margin-top:16px;font-size:26px;font-weight:700;letter-spacing:-.3px}
.hero .hd{margin-top:6px;font-size:17px;line-height:1.38;color:var(--sub);white-space:pre-line}
.hero.center .hh{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:28px}
.hero.center .ht{margin-top:12px}
.ir{position:relative;display:flex;align-items:center;gap:14px;min-height:52px;padding:0 20px}
.ir.tap{cursor:pointer}
.ir.tap:active{background:var(--press)}
.card .ir+.ir::before,.hrows .ir::before,.inote::before{content:"";position:absolute;top:0;left:var(--sl,20px);right:20px;height:.5px;background:var(--sep)}
.ir.hasi{--sl:62px}
.ir.ind{padding-left:48px;--sl:48px}
.ir.two{min-height:62px;padding-top:8px;padding-bottom:8px}
.ib{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.itx{flex:1;min-width:0}
.il{display:block;font-size:17px;line-height:1.25}
.isub{display:block;margin-top:2px;font-size:14px;color:var(--sub)}
.iv{font-size:17px;color:var(--sub);white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.info{flex:none;width:26px;height:26px;color:var(--blue)}
.ud{flex:none;width:10px;height:18px;color:var(--sub)}
.ck{flex:none;width:22px;height:22px;color:var(--blue)}
.inote{position:relative;padding:12px 20px 16px 62px;font-size:15px;line-height:1.4;color:var(--sub)}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,35%{background:var(--sel)}100%{background:transparent}}
.spin{width:20px;height:20px;color:var(--hdr);animation:spin .9s steps(8) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sld{gap:14px;min-height:60px;color:var(--sub)}
.sld svg{flex:none}
.sld .se{flex:none;font-size:13px}
.trk{position:relative;flex:1;height:6px;border-radius:3px;background:var(--off)}
.trk i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--blue)}
.trk b{position:absolute;top:50%;width:36px;height:24px;margin:-12px 0 0 -18px;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}

/* 특별한 카드들 */
.bat{padding:22px 20px 24px}
.bpct{font-size:46px;font-weight:700;letter-spacing:-1px;line-height:1}
.bpct small{margin-left:2px;font-size:18px;font-weight:600;letter-spacing:0}
.blast{margin-top:14px;font-size:14px;font-weight:600}
.bbar{margin-top:12px;height:10px;border-radius:5px;background:var(--off);overflow:hidden}
.bbar i{display:block;height:100%;border-radius:5px;background:var(--bar2);transition:background-color .3s}
.bbar i.low{background:#FFCC00}
.binfo{position:absolute;top:18px;right:20px;width:22px;height:22px;color:var(--sub)}
.ubold{padding:16px 16px 14px;font-size:15px;font-weight:600}
.useb{padding:0 16px}
.useb .ir{padding:0}
.useb .ir.hasi{--sl:42px}
.card .ulist .ir::before{content:"";position:absolute;top:0;left:0;right:0;height:.5px;background:var(--sep)}
.usep{height:.5px;background:var(--sep)}
.ustats{display:flex;gap:44px;padding-top:16px}
.ustats span{display:block;font-size:13px;font-weight:600;color:var(--sub)}
.ustats b{display:block;margin-top:2px;font-size:26px;font-weight:600}
.ustats small{font-size:15px}
.ustats .tdy span,.ustats .tdy b{color:var(--blue)}
.uchart{position:relative;display:flex;align-items:flex-end;gap:15px;height:110px;margin-top:12px;border-bottom:1px solid var(--sep)}
.ubar{position:relative;width:21px;border-radius:6px 6px 0 0;background:var(--bar1);overflow:hidden}
.ubar i{position:absolute;left:0;right:0;bottom:0;background:var(--bar2)}
.ubar.tdy{background:transparent}
.ubar.tdy i{background:var(--blue);border-radius:6px 6px 0 0}
.uavg{position:absolute;right:0;bottom:6px;font-size:12px;color:var(--sub)}
.udays{display:flex;gap:15px;margin-top:6px}
.udays span{width:21px;text-align:center;font-size:12px;color:var(--sub)}
.udays .tdy{color:var(--blue)}
.uleg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;font-size:12px;color:var(--sub)}
.uleg i{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:var(--bar1)}
.uleg i.d2{background:var(--bar2)}
.usub{margin:26px 0 10px;font-size:17px;font-weight:600;color:var(--hdr)}
.dq{position:relative;z-index:1;display:flex;align-items:center;gap:8px;width:min(280px,50%);height:44px;margin-left:auto;padding:0 12px 0 14px;border-radius:22px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--glassb);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--sub)}
.dq[hidden]{display:none}
.dq svg{flex:none;width:20px;height:20px}
.dq input{flex:1;min-width:0;height:100%;padding:0;border:0;outline:0;background:transparent;font:inherit;font-size:17px;color:var(--text);-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.dq input::placeholder{color:var(--sub)}
.dq input::-webkit-search-cancel-button{display:none}
.dcontent .nores{padding:60px 20px}
@media (min-width:700px){.dnav.lt .dt{left:20px;right:auto;text-align:left;opacity:1}.dnav.lt .back{display:none}}
@media (max-width:699px){.dnav.lt .dt{opacity:0}.dq{flex:1;width:auto;margin-left:12px}}
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.45);animation:fadein .25s}
.sheet[hidden]{display:none}
.sbox{width:min(560px,100%);max-height:calc(100% - 48px);overflow:auto;padding:52px 36px 32px;border-radius:36px;background:var(--card);box-shadow:0 20px 60px rgba(0,0,0,.4);animation:sheetin .34s cubic-bezier(.32,.72,0,1)}
@keyframes fadein{from{opacity:0}}
@keyframes sheetin{from{transform:translateY(40px) scale(.98);opacity:0}}
.sic{display:flex;justify-content:center;color:var(--blue)}
.sic svg{width:76px;height:76px}
.sbox h2{margin:30px 0 6px;font-size:22px;font-weight:700}
.sd{font-size:17px;line-height:1.4;color:var(--sub)}
.sfeat{display:flex;align-items:flex-start;gap:16px;margin-top:22px;color:var(--blue)}
.sfeat svg{flex:none;width:34px;height:34px}
.sfeat b{display:block;font-size:16px;font-weight:600;color:var(--text)}
.sfeat span{display:block;margin-top:2px;font-size:15px;line-height:1.35;color:var(--sub)}
.sbtns{display:flex;flex-direction:column;gap:10px;max-width:390px;margin:36px auto 0}
.sbtn{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:25px;font-size:17px;font-weight:600;text-align:center;cursor:pointer}
.sbtn.pri{background:var(--blue);color:#fff}
.sbtn.alt{background:var(--off);color:var(--text)}
.sbtn:active{transform:scale(.97)}
.fld{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px 0 20px;font-size:17px}
.fld span{flex:1}
.fld svg{flex:none;width:20px;height:20px;color:var(--chev)}
.alerts{display:flex;justify-content:space-around;padding:22px 12px 18px}
.alerts figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px}
.alerts.dim figure{opacity:.4}
.amock{position:relative;width:66px;height:94px;border-radius:12px;background:var(--off);overflow:hidden}
.amock i{position:absolute;left:7px;right:7px;height:12px;border-radius:5px;background:var(--sub);opacity:.55}
.cmsg{padding:30px 24px;text-align:center}
.cmsg .t1{font-size:22px;font-weight:700}
.cmsg .t2{margin-top:6px;font-size:15px;line-height:1.4;color:var(--sub)}
.stor{padding:18px 20px 20px}
.stor .st{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:17px;font-weight:600}
.stor .su{font-size:15px;font-weight:400;color:var(--sub)}
.sbar{display:flex;gap:2px;height:22px;margin-top:12px;border-radius:6px;overflow:hidden;background:var(--off)}
.sbar i{display:block;height:100%}
.sleg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px;color:var(--sub)}
.sleg b{display:inline-block;width:9px;height:9px;margin-right:6px;border-radius:50%}
.appr{display:flex;justify-content:center;gap:48px;padding:24px 20px 20px}
.appr figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:15px}
.mock{width:86px;height:118px;padding:12px 9px;border-radius:14px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 1px var(--glassb)}
.mock i{display:block;height:9px;border-radius:5px}
.mock.lt{background:#F2F2F7}.mock.lt i{background:#fff}
.mock.dk{background:#1C1C1E}.mock.dk i{background:#3A3A3C}
.mock i:first-child{width:60%;height:12px}
.radio{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--chev);display:flex;align-items:center;justify-content:center}
.radio.on{box-shadow:none;background:var(--blue);color:#fff}
.radio svg{width:14px;height:14px}
.wall{display:flex;justify-content:center;gap:20px;padding:24px 20px 20px}
.wall figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.wp{position:relative;width:126px;height:176px;border-radius:16px;overflow:hidden;color:#fff;background:radial-gradient(circle at 30% 20%,#7A8CE8 0%,transparent 55%),radial-gradient(circle at 80% 85%,#E86A9A 0%,transparent 50%),linear-gradient(160deg,#3A4A9A,#161B3D)}
.wp .wt{position:absolute;top:22px;left:0;right:0;text-align:center;font-size:34px;font-weight:600;letter-spacing:-.5px}
.wp .wdate{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:9px;font-weight:600;opacity:.9}
.wp .wg{position:absolute;inset:18px 14px auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.wp .wg i{display:block;aspect-ratio:1;border-radius:5px;background:rgba(255,255,255,.32)}
.pill{height:34px;padding:0 16px;border-radius:17px;background:var(--off);font-size:15px;font-weight:600;display:flex;align-items:center}
.prep{padding:26px 24px 24px;text-align:center}
.prep svg{width:64px;height:64px;color:var(--blue)}
.prep .t1{margin-top:10px;font-size:20px;font-weight:700}
.prep .t2{margin-top:6px;font-size:15px;line-height:1.4;color:var(--sub)}
.prep .t3{margin-top:14px;font-size:17px;color:var(--blue)}

/* 켜고 끄기 효과 */
.tg{transition:background-color .25s}
.tg i{transition:left .25s cubic-bezier(.3,.7,.4,1)}
.r[data-tg]{cursor:pointer}
.trk{touch-action:none;cursor:pointer}
.trk::after{content:"";position:absolute;left:-10px;right:-10px;top:-16px;bottom:-16px}
.lk{flex:none;width:13px;height:16px;color:var(--text)}
.wbars{flex:none;width:20px;height:16px;color:var(--text)}
.afig,.appr figure{cursor:pointer}
.dcontent,#menu,#results{zoom:var(--tz,1)}
#tint{position:fixed;inset:0;z-index:50;background:#FF8A00;mix-blend-mode:multiply;opacity:0;pointer-events:none;transition:opacity .3s}
#dim{position:fixed;inset:0;z-index:51;background:#000;opacity:0;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);z-index:60;padding:12px 20px;border-radius:22px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--glassb),0 8px 24px rgba(0,0,0,.2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--text);font-size:15px;font-weight:600;opacity:0;transform:translate(-50%,16px);transition:opacity .25s,transform .25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
html.boldtext body{font-weight:600}
html.boldtext .il,html.boldtext .rl,html.boldtext .rt,html.boldtext .iv,html.boldtext .rv,html.boldtext .foot,html.boldtext .hd,html.boldtext .isub,html.boldtext .ps,html.boldtext .rp{font-weight:600}
html.btnshape .lnk{text-decoration:underline}
html.btnshape .gbtn{box-shadow:inset 0 0 0 1.5px var(--blue)}
html.oolabel .tg.on::before{content:"";position:absolute;left:13px;top:9px;width:2px;height:10px;border-radius:1px;background:#fff}
html.oolabel .tg:not(.on)::before{content:"";position:absolute;right:11px;top:9.5px;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--sub)}
html.notransp .dnav::before,html.notransp .lnav.scrolled{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}
html.notransp .shead{-webkit-backdrop-filter:none;backdrop-filter:none}
html.notransp .gbtn,html.notransp #toast{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--card)}
html.notransp .search{background:var(--card)}
html.contrast{--sep:rgba(128,128,128,.9);--chev:var(--sub)}
html.contrast .iv,html.contrast .rv,html.contrast .foot,html.contrast .sh,html.contrast .isub,html.contrast .ps,html.contrast .hd,html.contrast .rp{color:var(--text)}
html.nomotion *,html.nomotion *::before,html.nomotion *::after{transition:none!important;animation:none!important}
html.nomotion .spin{animation:spin .9s steps(8) infinite!important}

/* 아이패드(넓은 화면) */
@media (min-width:700px){
  .list{width:var(--sidew);background:var(--sidebg);padding-right:16px;transform:none!important;z-index:1}
  .detail{left:var(--sidew);right:0;width:auto;transform:none!important;z-index:0}
  .lnav,h1{display:none}
  .shead{position:sticky;top:0;z-index:3;margin:0 -16px 10px calc(-16px - env(safe-area-inset-left));padding:calc(env(safe-area-inset-top) + 56px) 16px 14px calc(env(safe-area-inset-left) + 16px);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
  .groups{gap:12px}
  .list .c{background:none;border-radius:0;overflow:visible}
  .list .c .r+.r::before{display:none}
  .list .r{border-radius:26px;padding:0 14px}
  .list .r:active,.list .r.on{background:var(--sel)}
  .list .r.x:active{background:none}
  .list .chev{display:none}
  .back{visibility:hidden}
  .dnav.canback .back{visibility:visible}
}
</style>
</head>
<body>
<div class="app" id="app">
  <main class="pane list" id="list" aria-label="설정 목록">
    <div class="lnav" id="lnav" aria-hidden="true"><div class="lnt">설정</div></div>
    <h1>설정</h1>
    <div class="shead">
      <label class="search" id="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg>
        <input id="q" type="search" placeholder="검색" aria-label="설정 검색" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="sclear" id="qclear" aria-label="검색어 지우기"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="var(--card)" stroke-width="2" stroke-linecap="round"/></svg></button>
        <span class="smic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg></span>
      </label>
    </div>
    <div class="groups" id="menu"></div>
    <div id="results" hidden></div>
  </main>
  <section class="pane detail" id="detail">
    <header class="dnav" id="dnav">
      <button class="gbtn back" id="back" type="button" aria-label="뒤로"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2 2 10l8 8"/></svg></button>
      <h2 class="dt" id="dt"></h2>
      <label class="dq" id="dq" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg><input id="dqi" type="search" placeholder="앱 검색" aria-label="앱 검색" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg></label>
      <button class="gbtn" id="dbtn" type="button"></button>
    </header>
    <div class="dcontent" id="dcontent"></div>
  </section>
  <div id="sheet" class="sheet" hidden></div>
</div>
<div id="tint" aria-hidden="true"></div>
<div id="dim" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================
   여기서부터 고치면 돼요
   ========================================================== */

const SETTINGS = {
  theme: 'auto',      // 'auto' = 기기 다크 모드 따라감 / 'light' = 항상 밝게 / 'dark' = 항상 어둡게
  radius: 26,         // 카드 모서리 둥글기(px)
  startPage: '일반',  // 아이패드에서 처음 열려 있을 메뉴 이름 (그다음부터는 마지막에 본 화면)
};

const PROFILE = { name: '정경훈', sub: 'Apple 계정, iCloud+ 등', initial: '경훈' };

// 일반 > 정보 화면 등에 나오는 기기 정보. 실제 아이패드 '정보' 화면을 보고 맞춰 주세요.
const DEVICE = {
  name: '정경훈의 iPad',
  os: '27.2.1',
  model: 'iPad Air(5세대)',
  modelNumber: 'MM713KH/A',
  serial: 'FFG3WL649Y',        // 공개 저장소에 올리면 누구나 볼 수 있어요. 숨기려면 '' 로 비우세요
  warranty: '보증이 만료됨',
  songs: '2',
  videos: '292',
  photos: '7,011',
  apps: '75',
  capacity: '256GB',
  free: '23.36GB',
  wifiAddress: 'B0:E5:EF:67:68:24',
  btAddress: 'B0:E5:EF:68:B6:06',
};

// 실제 앱 이름을 띄우지 않고, 설치된 앱을 카테고리로 묶어서 보여 줘요 (count 합계 = DEVICE.apps)
//   알림·앱·개인정보·검색 화면의 목록에 이 카테고리들이 나와요
//   notify 알림 스타일 / location 위치 접근 / photos 사진 접근 / camera·mic 카메라·마이크 허용
const APPS = [
  { name: '소셜', count: 9, icon: 'speech', color: '#34C759', notify: '배너, 사운드, 배지', location: '사용하는 동안', photos: '선택한 사진', camera: true, mic: true },
  { name: '생산성 및 금융', count: 14, icon: 'briefcase', color: '#007AFF', notify: '배너, 배지', location: '안 함', photos: '없음', camera: true, mic: false },
  { name: '교육', count: 8, icon: 'book', color: '#FF9500', notify: '배너', location: '안 함', photos: '없음', camera: false, mic: true },
  { name: '엔터테인먼트', count: 10, icon: 'tv', color: '#FF2D55', notify: '배너, 사운드', location: '안 함', photos: '없음', camera: false, mic: false },
  { name: '게임', count: 6, icon: 'gamepad', color: '#5E5CE6', notify: '끔', location: '안 함', photos: '없음', camera: false, mic: false },
  { name: '창의력', count: 4, icon: 'pencil', color: '#AF52DE', notify: '배너', location: '안 함', photos: '전체 접근', camera: true, mic: false },
  { name: '정보 및 독서', count: 7, icon: 'doc', color: '#8E8E93', notify: '배너, 배지', location: '안 함', photos: '없음', camera: false, mic: false },
  { name: '쇼핑 및 음식', count: 6, icon: 'bag', color: '#FF3B30', notify: '배너, 배지', location: '사용하는 동안', photos: '없음', camera: false, mic: false },
  { name: '유틸리티', count: 11, icon: 'toggles', color: '#30B0C7', notify: '배너', location: '사용하는 동안', photos: '선택한 사진', camera: true, mic: true },
];

// 배터리 성능 상태 화면에 나오는 최대 용량
const BATTERY = { health: '96%' };

// Wi-Fi를 켜면 '다른 네트워크' 옆 표시가 돌면서 검색만 하고, 아무 네트워크도 나오지 않아요.
// 나중에 네트워크가 나타나게 하고 싶으면 여기에 넣으면 돼요. 예) { name: 'iptime', lock: true, bars: 3 }
const NETWORKS = [];

// 처음 상태 (나중에 바꾼 값은 아이패드에 저장돼서 다음에 열어도 그대로예요)
const DEFAULTS = {
  airplane: false,   // 에어플레인 모드
  wifi: false,       // Wi-Fi
  bt: true,          // Bluetooth
  brightness: 0.5,   // 밝기 막대 (0~1, 0.5가 원래 밝기)
  textSize: 0.5,     // 텍스트 크기 막대 (0.5가 기본)
  volume: 0.6,       // 음량 막대 (알림음 미리듣기 소리 크기)
  nightTemp: 0.5,    // Night Shift 색 온도
  speechRate: 0.5,   // 말하기 속도
  balance: 0.5,      // 왼쪽/오른쪽 소리 밸런스
};

// 일반 > iPad 저장 공간 화면 (size 단위 GB, 막대 길이에 쓰여요)
const STORAGE = {
  label: 'iPad',
  total: 256,
  parts: [
    { name: '앱', size: 118.4, color: '#FF3B30' },
    { name: '사진', size: 72.6, color: '#FFCC00' },
    { name: 'iPadOS', size: 11.8, color: '#8E8E93' },
    { name: '시스템 데이터', size: 29.84, color: '#C7C7CC' },
  ],
  apps: [
    { name: '게임', size: '38.2GB' },
    { name: '엔터테인먼트', size: '24.6GB' },
    { name: '소셜', size: '17.9GB' },
    { name: '생산성 및 금융', size: '14.3GB' },
    { name: '교육', size: '9.8GB' },
    { name: '유틸리티', size: '6.1GB' },
  ],
};

// 프로필 > iCloud 화면 저장 공간 (GB)
const ICLOUD = {
  label: 'iCloud',
  total: 5,
  parts: [
    { name: '사진', size: 1.1, color: '#FFCC00' },
    { name: '백업', size: 0.6, color: '#AF52DE' },
    { name: '기타', size: 0.3, color: '#8E8E93' },
  ],
};

// ---------- 왼쪽 메뉴 ----------
// [ ] 하나 = 묶음 하나, { } 한 줄 = 메뉴 하나.
//   title 이름 / color 아이콘 배경색 / fg 아이콘 그림 색(기본 흰색) / icon 아래 ICONS 이름 / text 아이콘 대신 글자
//   value 오른쪽 회색 글씨 / valueFrom '@이름' 그 스위치에 따라 valueOn/valueOff 글씨
//   toggle 넣으면 스위치 줄 (처음 값), key 스위치 이름 (예: 'airplane')
const GROUPS = [
  [
    { title: '에어플레인 모드', color: '#FF9500', icon: 'airplane', toggle: false, key: 'airplane' },
    { title: 'Wi-Fi', color: '#007AFF', icon: 'wifi', valueFrom: '@wifi', valueOn: '연결되지 않음', valueOff: '끔' },
    { title: 'Bluetooth', color: '#007AFF', icon: 'bluetooth', valueFrom: '@bt', valueOn: '켬', valueOff: '끔' },
    { title: '배터리', color: '#34C759', icon: 'battery' },
  ],
  [
    { title: '일반', color: '#8E8E93', icon: 'gear' },
    { title: '손쉬운 사용', color: '#007AFF', icon: 'access' },
    { title: '검색', color: '#8E8E93', icon: 'search' },
    { title: '디스플레이 및 밝기', color: '#007AFF', icon: 'sun' },
    { title: '멀티태스킹 및 제스처', color: '#007AFF', icon: 'multitask' },
    { title: '배경화면', color: '#2FB4E8', icon: 'flower' },
    { title: '제어 센터', color: '#8E8E93', icon: 'toggles' },
    { title: '카메라', color: '#8E8E93', icon: 'camera' },
    { title: '홈 화면 및 앱 보관함', color: '#007AFF', icon: 'homescreen' },
    { title: '화면 모드', color: '#000000', icon: 'mode' },
    { title: 'Apple Pencil', color: '#8E8E93', icon: 'pencil' },
  ],
  [
    { title: '알림', color: '#FF3B30', icon: 'bell' },
    { title: '사운드', color: '#FF2D55', icon: 'speaker' },
    { title: '집중 모드', color: '#5E5CE6', icon: 'moon' },
    { title: '스크린 타임', color: '#5E5CE6', icon: 'hourglass' },
  ],
  [
    { title: 'Touch ID 및 암호', color: '#FFFFFF', fg: '#FF375F', icon: 'fingerprint' },
    { title: '개인정보 보호 및 보안', color: '#007AFF', icon: 'hand' },
  ],
  [
    { title: '앱', color: '#5E5CE6', icon: 'apps' },
  ],

// ---------- 화면을 짧게 쓰는 도우미들 ----------
// pick(['2분','5분'], '5분') → 하나만 고르는 목록 (누르면 체크가 옮겨가요)
//   세 번째 칸에 이름을 주면 다른 곳에서 그 값을 쓸 수 있어요. 예) pick([...], '기본', 'displayZoom')
const pick = (list, on, group, extra = {}) => list.map((t) => ({ title: t, choice: true, check: t === on, group, ...extra }));
// 여러 개를 고를 수 있는 체크 목록
const multi = (list, onList = []) => list.map((t) => ({ title: t, multi: true, check: onList.includes(t) }));
// 가운데 큰 글씨 + 작은 설명만 있는 화면
const center = (a, b) => ({ sections: [{ custom: 'center', lines: [a, b] }] });
// 스위치 하나 + 설명 화면 (key를 주면 실제 효과와 연결돼요)
const onoff = (title, on, footer, key) => ({ sections: [{ rows: [{ title, toggle: on, key }], footer }] });
const def = (key, val) => { if (!(key in DEFAULTS)) DEFAULTS[key] = val; return key; };
const NOW = new Date();
const DATE_STR = `${NOW.getFullYear()}. ${NOW.getMonth() + 1}. ${NOW.getDate()}.`;
const appTile = (name) => { const a = APPS.find((x) => x.name === name); return a ? { icon: a.icon, color: a.color } : { text: name.slice(0, 1), color: '#636366' }; };
const device = (name) => ({ title: name, value: '연결 안 됨', info: true,
  page: { sections: [{ rows: [{ title: '이름', value: name }] }, { rows: [{ title: '이 기기 지우기', link: true }] }] } });
const TONES = ['없음', '노트', '휙', '차임', '오로라', '대나무', '화음', '팝콘'];
const tone = (title, on) => ({ title, value: on, page: { sections: [{ header: '알림음', rows: pick(TONES, on, undefined, { sound: true }) }] } });
const notifKey = (a) => def(`notif:${a.name}`, a.notify !== '끔');
const notifPage = (a) => {
  const k = notifKey(a);
  return { sections: [
    { rows: [{ title: '알림 허용', toggle: a.notify !== '끔', key: k }] },
    { header: '알림', custom: 'alerts', showIf: '@' + k },
    { showIf: '@' + k, rows: [
      { title: '배너 스타일', value: '일시적', page: { sections: [{ rows: pick(['일시적', '지속적'], '일시적'), footer: '지속적 배너는 직접 넘기기 전까지 화면에 남아 있습니다.' }] } },
      { title: '사운드', toggle: a.notify.includes('사운드') },
      { title: '배지', toggle: a.notify.includes('배지') },
    ] },
    { header: '잠금 화면 모습', showIf: '@' + k, rows: [
      { title: '미리보기 표시', value: '잠금 해제 시', page: { sections: [{ rows: pick(['항상', '잠금 해제 시', '안 함'], '잠금 해제 시') }] } },
      { title: '알림 그룹', value: '자동', page: { sections: [{ rows: pick(['자동', '앱별', '끔'], '자동') }] } },
    ] },
  ] };
};
const notifValue = (a) => ({ valueFrom: '@' + notifKey(a), valueOn: a.notify === '끔' ? '배너, 사운드, 배지' : a.notify, valueOff: '끔' });
const appPage = (a) => ({ sections: [
  { header: `${a.name} 앱 ${a.count}개에 접근 허용`, footer: '이 카테고리에 있는 모든 앱에 함께 적용됩니다.', rows: [
    { title: '위치', value: a.location, icon: 'location', color: '#007AFF', page: { sections: [
      { header: '위치 접근 허용', rows: pick(['안 함', '다음번에 묻기 또는 공유할 때', '사용하는 동안'], a.location) },

/* ==========================================================

   ========================================================== */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (s) => esc(s).replace(/\[([^\]]+)\]/g, '<span class="lnk">$1</span>');
const wide = window.matchMedia('(min-width: 700px)');
const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
const items = { profile: { title: PROFILE.name, avatar: true, page: '프로필' } };
GROUPS.flat().forEach((it) => { items[it.title] = it; });
const nav = { id: null, stack: [] };   // 지금 보고 있는 메뉴와, 그 안으로 들어간 화면들
let REG = [];                          // 지금 화면에서 누르면 들어가는 줄들
let CUR_PATH = [];                     // 지금 화면의 위치 (스위치 이름을 정할 때 씀)
let CUR_SIDX = 0;
let CUR_SDEF;
let WIFI_ON_AT = Date.now();
let refreshTimer = null;
let APPQ = '';                         // 오른쪽 위 '앱 검색' 칸에 입력한 글자

const root = document.documentElement;
root.style.setProperty('--radius', SETTINGS.radius + 'px');
const syncBarColor = () => { $('themeColor').content = getComputedStyle(root).getPropertyValue('--bg').trim(); };

/* ---------- 바꾼 값 저장 ---------- */
const STORE_KEY = 'settings.state.v1';
let STATE = {};
try { STATE = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { STATE = {}; }
def('appearanceAuto', SETTINGS.theme === 'auto');
def('appearance', SETTINGS.theme === 'light' ? 'light' : 'dark');
def('displayZoom', '기본');
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); } catch (e) {} };
const has = (k) => Object.prototype.hasOwnProperty.call(STATE, k);
const get = (k, fb) => (has(k) ? STATE[k] : (k in DEFAULTS ? DEFAULTS[k] : fb));

function set(key, val) {
  if (key === 'airplane') {
    if (val) { STATE._prev = { wifi: get('wifi'), bt: get('bt') }; STATE.wifi = false; STATE.bt = false; }
    else if (STATE._prev) { STATE.wifi = STATE._prev.wifi; STATE.bt = STATE._prev.bt; delete STATE._prev; if (STATE.wifi) WIFI_ON_AT = Date.now(); }
  }
  if (key === 'wifi' && val) WIFI_ON_AT = Date.now();
  if (key === 'appearance') STATE.appearanceAuto = false;
  STATE[key] = val;
  save();
  applyEffects();
}

const pathKey = (title, path = CUR_PATH) => [...path, title].join('/');
const rowKey = (r, path = CUR_PATH) => r.key || pathKey(r.title, path);
const toggleOn = (r, path) => !!get(rowKey(r, path), !!r.toggle);
const allRows = (page) => [...(page.rows || []), ...(page.sections || []).flatMap((s) => s.rows || [])];
function cond(expr, page, path = CUR_PATH) {
  if (!expr) return true;
  const neg = expr[0] === '!';
  const e = neg ? expr.slice(1) : expr;
  let v = true;
  if (e[0] === '@') v = !!get(e.slice(1));
  else { const r = allRows(page).find((x) => x.title === e && 'toggle' in x); if (r) v = toggleOn(r, path); }
  return neg ? !v : v;
}

/* 아래 화면의 선택·스위치 값을 위 줄 오른쪽 글씨로 보여 주기 */
function derivedValue(r) {
  if (r.valueFrom) return get(r.valueFrom.slice(1)) ? (r.valueOn || '켬') : (r.valueOff || '끔');
  if (!r.page) return r.value;
  const childPath = [...CUR_PATH, r.title];
  const secs = r.page.sections || [];
  for (let i = 0; i < secs.length; i++) {
    const chs = (secs[i].rows || []).filter((x) => x.choice);
    if (chs.length) {
      const k = chs[0].group || `${childPath.join('/')}#${i}`;
      return get(k, (chs.find((x) => x.check) || {}).title) ?? r.value;
    }
  }
  if (r.value === '켬' || r.value === '끔') {
    const t = secs[0] && (secs[0].rows || [])[0];

let AC = null;
function audio() {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function output(ctx, vol) {
  const g = ctx.createGain();
  g.gain.value = vol;
  if (!get('mono') && ctx.createStereoPanner) {
    const p = ctx.createStereoPanner();
    p.pan.value = (+get('balance', 0.5) - 0.5) * 2;
    g.connect(p); p.connect(ctx.destination);
  } else g.connect(ctx.destination);
  return g;
}
const TONE_NOTES = {
  '노트': [[1046, 0.12], [1318, 0.22]],
  '차임': [[1318, 0.3], [988, 0.45]],
  '오로라': [[784, 0.14], [988, 0.14], [1175, 0.32]],
  '대나무': [[880, 0.08], [880, 0.08], [1320, 0.16]],
  '화음': [[523, 0.5, [659, 784]]],
  '팝콘': [[1500, 0.05], [1700, 0.05], [1900, 0.06]],
};
function playTone(name) {
  const ctx = audio();
  if (!ctx || name === '없음') return;
  const out = output(ctx, 0.4 * +get('volume', 0.6));
  let t = ctx.currentTime + 0.02;
  if (name === '휙') {
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(1400, t + 0.22);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6, t + 0.08); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.3);
    return;
  }
  (TONE_NOTES[name] || TONE_NOTES['노트']).forEach(([f, d, chord]) => {
    [f, ...(chord || [])].forEach((fr) => {
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = fr;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.8, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + d + 0.05);
    });
    t += d * 0.9;
  });
}
function keyClick() {
  const ctx = audio();
  if (!ctx) return;
  const out = output(ctx, 0.15 * +get('volume', 0.6));
  const o = ctx.createOscillator(); const g = ctx.createGain(); const t = ctx.currentTime;
  o.type = 'square'; o.frequency.value = 1900;
  g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.03);
}

}

function irow(r) {
  if (r.slider !== undefined) {
    const key = rowKey(r);

    const [a, b] = r.ends ? r.ends.map((t) => `<span class="se">${esc(t)}</span>`) : r.endIcons === 'volume' ? [UI.volS, UI.volL] : [UI.sunS, UI.sunL];

  }
  const hasI = !!(r.icon || r.text);
  const isToggle = 'toggle' in r;
  let attrs = '';
  let checked = !!r.check;
  if (isToggle) { const k = rowKey(r); def(k, !!r.toggle); attrs += ` data-tg="${esc(k)}"`; }
  if (r.choice) {
    const k = r.group || `${CUR_PATH.join('/')}#${CUR_SIDX}`;

    attrs += ` data-ch="${esc(k)}" data-v="${esc(r.title)}"${r.sound ? ' data-snd="1"' : ''}`;
  } else if (r.multi) {
    const k = pathKey(r.title) + '#m';
    def(k, !!r.check);
    checked = !!get(k);
    attrs += ` data-mc="${esc(k)}"`;
  }
  if (r.action) attrs += ` data-act="${esc(r.action)}"`;
  const sub = typeof r.sub === 'function' ? r.sub() : r.sub;
  const value = (r.value != null || r.valueFrom) ? derivedValue(r) : null;
  let right = '';
  if (value != null) right += `<span class="iv">${esc(value)}</span>`;
  if (r.popup) right += `<span class="iv">${esc(r.popup)}</span>${UI.updown}`;
  if (r.info) right += UI.info;
  if (isToggle) right += `<span class="tg${get(rowKey(r)) ? ' on' : ''}" aria-hidden="true"><i></i></span>`;
  if (checked) right += UI.check;
  const isPick = r.choice || r.multi;

  if (chev) right += '<span class="chev"></span>';

  if (k >= 0) attrs += ` data-k="${k}"`;
  if (k >= 0 && r.needs) attrs += ` data-need="${esc(r.needs)}"`;
  const tap = chev || r.link || r.danger || r.info || r.popup || k >= 0 || isToggle || isPick || r.action;
  const cls = ['ir', hasI && 'hasi', r.indent && 'ind', tap && 'tap', sub && 'two'].filter(Boolean).join(' ');
  const tcls = r.link ? ' lnk' : r.danger ? ' dng' : '';

}

  if (page.desc) h += `<div class="hd">${fmt(page.desc)}</div>`;
  h += '</div>';
  if (page.rows && page.rows.length) h += `<div class="hrows">${page.rows.map(irow).join('')}</div>`;
  h += '</div>';
  if (page.footer) h += footer(page.footer, page);
  return h + '</div>';
}

/* 왼쪽 메뉴 */
function menuValue(it) {
  if (it.valueFrom) return get(it.valueFrom.slice(1)) ? (it.valueOn || '켬') : (it.valueOff || '끔');
  return it.value;
}
function toggleRowHTML(it, body) {
  const key = it.key || it.title;
  def(key, !!it.toggle);
  return `<div class="r x" data-tg="${esc(key)}" data-t="${esc(it.title)}">${body}<span class="tg${get(key) ? ' on' : ''}" aria-hidden="true"><i></i></span></div>`;
}
function menuRow(it) {
  if ('toggle' in it) return toggleRowHTML(it, `${tile(it)}<span class="rl">${esc(it.title)}</span>`);
  const val = menuValue(it);
  const v = val ? `<span class="rv">${esc(val)}</span>` : '';
  return `<button class="r" type="button" data-id="${esc(it.title)}">${tile(it)}<span class="rl">${esc(it.title)}</span>${v}<span class="chev"></span></button>`;
}
function markMenu() {
  $('menu').querySelectorAll('.r.on').forEach((el) => el.classList.remove('on'));
  const btn = [...$('menu').querySelectorAll('.r[data-id]')].find((el) => el.dataset.id === nav.id);
  if (btn) btn.classList.add('on');
}
function renderMenu() {
  const profile = `<div class="c pf"><button class="r" type="button" data-id="profile">${tile(items.profile)}<span class="rb"><span class="pn">${esc(PROFILE.name)}</span><span class="ps">${esc(PROFILE.sub)}</span></span><span class="chev"></span></button></div>`;
  $('menu').innerHTML = profile + GROUPS.map((g) => `<div class="c">${g.map(menuRow).join('')}</div>`).join('');
  markMenu();
}

/* 검색: 메뉴 이름 + 안쪽 화면, 그 안의 하위 화면까지 */
const INDEX = [];
function buildIndex() {
  const seen = new Set();
  const add = (e) => { const key = `${e.id}|${e.path.join('>')}|${e.title}`; if (e.title && !seen.has(key)) { seen.add(key); INDEX.push(e); } };
  const walk = (id, page, path, label) => {
    if (!page) return;
    const rows = [...(page.rows || []), ...(page.sections || []).flatMap((s) => { if (s.header) add({ id, title: s.header, path, label }); return s.rows || []; })];
    rows.forEach((r) => {
      if (r.slider !== undefined) return;
      add({ id, title: r.title, path, label });
      if (r.page) walk(id, r.page, [...path, r.title], `${label} › ${r.title}`);
    });
  };
  add({ id: 'profile', title: PROFILE.name, path: [], label: null });
  walk('profile', PAGES['프로필'], [], PROFILE.name);
  GROUPS.flat().forEach((it) => { add({ id: it.title, title: it.title, path: [], label: null }); walk(it.title, PAGES[it.title], [], it.title); });
}

function renderResults(q) {
  const ql = q.toLowerCase();
  const hits = INDEX.map((e, i) => ({ e, i })).filter(({ e }) => e.title.toLowerCase().includes(ql))
    .sort((a, b) => (a.e.label ? 1 : 0) - (b.e.label ? 1 : 0) || a.e.path.length - b.e.path.length);
  if (!hits.length) { $('results').innerHTML = `<div class="nores">‘${esc(q)}’에 대한 결과 없음</div>`; return; }
  $('results').innerHTML = `<div class="c">${hits.slice(0, 80).map(({ e, i }) => {
    const it = items[e.id];
    const body = `${tile(it)}<span class="rb"><span class="rt">${esc(e.title)}</span>${e.label ? `<span class="rp">${esc(e.label)}</span>` : ''}</span>`;
    if (!e.label && it && 'toggle' in it) return toggleRowHTML(it, body);
    return `<button class="r sr" type="button" data-i="${i}">${body}<span class="chev"></span></button>`;
  }).join('')}</div>`;
}

function runSearch() {
  const q = $('q').value.trim();
  $('search').classList.toggle('has', $('q').value.length > 0);
  $('menu').hidden = !!q;
  $('results').hidden = !q;
  if (q) renderResults(q);
}

/* 오른쪽 화면 그리기 */
function currentPage() {
  const item = items[nav.id];
  const top = nav.stack[nav.stack.length - 1];
  if (top) return { item: { title: top.title }, page: top.page, heroOn: false };
  const page = PAGES[item.page || item.title] || {};
  return { item, page, heroOn: page.hero !== false };
}

function render(anim) {
  REG = [];
  CUR_PATH = [nav.id, ...nav.stack.map((s) => s.title)];
  const { item, page, heroOn } = currentPage();
  const qOn = !!page.navSearch && !nav.stack.length;
  if (!qOn && APPQ) { APPQ = ''; $('dqi').value = ''; }
  $('dq').hidden = !qOn;
  if (qOn) $('dqi').placeholder = page.navSearch;
  $('dnav').classList.toggle('lt', qOn);
  let html = heroOn ? hero(item, page) : '';
  if (qOn && APPQ.trim()) {
    const ql = APPQ.trim().toLowerCase();
    const rows = (page.searchRows ? page.searchRows() : []).filter((r) => r.title.toLowerCase().includes(ql));
    CUR_SIDX = 'q';
    CUR_SDEF = undefined;
    html += rows.length ? `<div class="sec"><div class="card">${rows.map(irow).join('')}</div></div>` : `<div class="nores">‘${esc(APPQ.trim())}’에 대한 결과 없음</div>`;
  } else {
    (page.sections || []).forEach((s, i) => { html += section(s, i, page); });
  }
  const dc = $('dcontent');
  dc.innerHTML = html;
  $('dt').textContent = item.title;
  $('dnav').classList.toggle('fixed', !heroOn);
  $('dnav').classList.toggle('canback', nav.stack.length > 0);
  $('dbtn').textContent = page.button || '';
  $('dbtn').style.visibility = page.button ? 'visible' : 'hidden';
  $('dbtn').style.display = qOn ? 'none' : '';
  dc.classList.remove('anim-push', 'anim-pop');
  if (anim) { $('dnav').classList.remove('scrolled', 'titled'); void dc.offsetWidth; dc.classList.add(anim); }
}

function refresh() {
  if (!nav.id) return;
  const y = $('detail').scrollTop;
  render(null);
  $('detail').scrollTop = y;
  onDetailScroll();
}
function updateAll() {
  renderMenu();
  if ($('q').value.trim()) runSearch();
  refresh();
}

function push(row, anim = true) {
  nav.stack.push({ title: row.title, page: row.page, scroll: $('detail').scrollTop });
  render(anim ? 'anim-push' : null);
  $('detail').scrollTop = 0;
  onDetailScroll();
}

function pop() {
  const s = nav.stack.pop();
  render('anim-pop');
  $('detail').scrollTop = s ? s.scroll : 0;
  onDetailScroll();
}

function findRow(page, title) {
  return allRows(page).find((r) => r.title === title && r.page);
}

function flash(title) {
  const el = [...$('dcontent').querySelectorAll('[data-t]')].find((n) => n.dataset.t === title);
  if (!el) return;
  setTimeout(() => {
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }, wide.matches ? 60 : 420);
}

function show(id, path = [], focus = null) {
  const item = items[id];
  if (!item || 'toggle' in item) return;
  nav.id = id;
  nav.stack = [];
  if (id === 'Wi-Fi') WIFI_ON_AT = Date.now();
  try { localStorage.setItem('settings.last', id); } catch (e) {}
  render(null);
  $('detail').scrollTop = 0;
  path.forEach((t) => { const row = findRow(currentPage().page, t); if (row) push(row, false); });
  onDetailScroll();
  markMenu();
  if (focus) flash(focus);
}

function showStart() {
  let id = null;
  try { id = localStorage.getItem('settings.last'); } catch (e) {}
  if (!id || !items[id] || 'toggle' in items[id]) id = items[SETTINGS.startPage] ? SETTINGS.startPage : 'profile';
  show(id);
}

/* 스크린 타임: 이 앱을 화면에 열어 둔 시간 기록 (활동을 켰을 때만) */
const USAGE_KEY = 'settings.usage.v1';
let USAGE = {};
try { USAGE = JSON.parse(localStorage.getItem(USAGE_KEY) || '{}') || {}; } catch (e) { USAGE = {}; }
const dayKey = (d = new Date()) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
let lastTick = Date.now();
function tickUsage() {
  const now = Date.now();
  if (get('stActivity') && document.visibilityState === 'visible') {
    const k = dayKey();
    USAGE[k] = (USAGE[k] || 0) + Math.min(30, Math.max(0, (now - lastTick) / 1000));
    try { localStorage.setItem(USAGE_KEY, JSON.stringify(USAGE)); } catch (e) {}
  }
  lastTick = now;
}
setInterval(tickUsage, 5000);
document.addEventListener('visibilitychange', () => { lastTick = Date.now(); });
function fmtDur(sec) {
  if (sec < 60) return sec > 0 ? '1분 미만' : '0분';
  const m = Math.round(sec / 60);
  return m >= 60 ? `${Math.floor(m / 60)}시간 ${m % 60}분` : `${m}분`;
}

/* 가운데 뜨는 안내 창 */
const SHEETS = {
  stActivity: {
    icon: '<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="30" cy="17" r="11" fill="currentColor"/><path d="M8 52c0-11.5 9.5-19 22-19 5.5 0 10 1.2 13.5 3.3V52z" fill="currentColor"/><path d="M45 38h17M45 64h17M47.5 38c0 9 12 9.5 12 13s-12 4-12 13M59.5 38c0 9-12 9.5-12 13s12 4 12 13" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    title: '앱 및 웹사이트 활동',
    desc: '사용자의 스크린 타임에 관한 심층 분석 리포트를 받고, 관리하려는 대상에 시간 제한을 설정합니다.',
    feats: [
      ['chart', '주간 리포트', '기기의 스크린 타임에 관한 주간 개요 알림을 받습니다.'],
      ['window', '시간 지정', '매일 화면을 보지 않는 시간을 설정합니다.'],
      ['hourglass', '허용 시간', '관리하려는 앱 카테고리에 대해 일일 사용 시간 제한을 설정합니다.'],
    ],
    on: '앱 및 웹사이트 활동 켜기',
    off: '지금 안 함',
  },
};
function openSheet(key) {
  const s = SHEETS[key];
  if (!s) return;
  const el = $('sheet');
  el.innerHTML = `<div class="sbox" role="dialog" aria-modal="true" aria-label="${esc(s.title)}"><div class="sic">${s.icon}</div><h2>${esc(s.title)}</h2><div class="sd">${esc(s.desc)}</div>${s.feats.map(([ic, t, d]) => `<div class="sfeat">${ICONS[ic] || ''}<div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`).join('')}<div class="sbtns"><button class="sbtn pri" type="button" data-sheet="on">${esc(s.on)}</button><button class="sbtn alt" type="button" data-sheet="off">${esc(s.off)}</button></div></div>`;
  el.dataset.key = key;
  el.hidden = false;
}
function closeSheet() { $('sheet').hidden = true; }

/* 누르기 처리 */
function flipToggle(el) {
  const key = el.dataset.tg;
  const v = !get(key);
  const sw = el.querySelector('.tg');
  if (sw) sw.classList.toggle('on', v);
  set(key, v);
  speak(`${el.dataset.t || ''} ${v ? '켬' : '끔'}`);
  if (el.classList.contains('afig')) updateAll();
  else setTimeout(updateAll, 260);
}
function doAction(a) {
  if (a === 'stOff') { set('stActivity', false); updateAll(); toast('앱 및 웹사이트 활동이 꺼졌습니다'); return; }
  if (a === 'reset') {
    STATE = {};
    save();
    WIFI_ON_AT = Date.now();
    applyEffects();
    updateAll();
    toast('설정이 재설정되었습니다');
  }
}

applyEffects();
renderMenu();
buildIndex();
if (wide.matches) showStart();

$('list').addEventListener('click', (e) => {
  const tg = e.target.closest('[data-tg]');
  if (tg) { flipToggle(tg); return; }
  const btn = e.target.closest('button.r');
  if (!btn) return;
  speak((btn.querySelector('.rl, .pn, .rt') || {}).textContent);
  if (btn.dataset.i) {
    const hit = INDEX[+btn.dataset.i];
    $('results').querySelectorAll('.r.on').forEach((el) => el.classList.remove('on'));
    btn.classList.add('on');
    show(hit.id, hit.path, hit.label ? hit.title : null);
  } else {
    show(btn.dataset.id);
  }
  if (!wide.matches) { $('q').blur(); $('app').classList.add('open'); }
});
$('dcontent').addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]');
  if (act) { doAction(act.dataset.act); return; }
  const ap = e.target.closest('[data-ap]');
  if (ap) { set('appearance', ap.dataset.ap); speak(ap.dataset.t); updateAll(); return; }
  const tg = e.target.closest('[data-tg]');
  if (tg) { flipToggle(tg); return; }
  const ch = e.target.closest('[data-ch]');
  if (ch) { set(ch.dataset.ch, ch.dataset.v); if (ch.dataset.snd) playTone(ch.dataset.v); speak(ch.dataset.v); updateAll(); return; }
  const mc = e.target.closest('[data-mc]');
  if (mc) { set(mc.dataset.mc, !get(mc.dataset.mc)); speak(mc.dataset.t); updateAll(); return; }
  const k = e.target.closest('[data-k]');
  if (k && REG[+k.dataset.k]) { speak(k.dataset.t); push(REG[+k.dataset.k]); if (k.dataset.need && !get(k.dataset.need)) openSheet(k.dataset.need); return; }
  const t = e.target.closest('[data-t]');
  if (t) speak(t.dataset.t);
});

$('sheet').addEventListener('click', (e) => {
  const b = e.target.closest('[data-sheet]');
  const key = $('sheet').dataset.key;
  if (b && b.dataset.sheet === 'on') {
    lastTick = Date.now();
    set(key, true);
    closeSheet();
    updateAll();
    toast('앱 및 웹사이트 활동이 켜졌습니다');
    return;
  }
  if ((b && b.dataset.sheet === 'off') || e.target.id === 'sheet') {
    closeSheet();
    if (nav.stack.length) pop();
  }
});

/* 막대(밝기·음량 등) 끌어서 바꾸기 */
let sl = null;
function moveSlider(e) {
  const r = sl.trk.getBoundingClientRect();
  const v = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  sl.trk.querySelector('i').style.width = `${v * 100}%`;
  sl.trk.querySelector('b').style.left = `${v * 100}%`;
  STATE[sl.key] = Math.round(v * 1000) / 1000;
  applyEffects();
}
$('dcontent').addEventListener('pointerdown', (e) => {
  const trk = e.target.closest('.trk');
  if (!trk) return;
  e.preventDefault();
  sl = { trk, key: trk.dataset.sl };
  moveSlider(e);
});
document.addEventListener('pointermove', (e) => { if (sl) { e.preventDefault(); moveSlider(e); } }, { passive: false });
const endSlider = () => { if (sl) { save(); sl = null; } };
document.addEventListener('pointerup', endSlider);
document.addEventListener('pointercancel', endSlider);

$('q').addEventListener('input', runSearch);
$('dqi').addEventListener('input', () => { APPQ = $('dqi').value; refresh(); });
$('dqi').addEventListener('keydown', (e) => { if (get('kbClick')) keyClick(); if (e.key === 'Enter') $('dqi').blur(); });
$('q').addEventListener('keydown', (e) => { if (get('kbClick')) keyClick(); if (e.key === 'Enter') $('q').blur(); });
$('qclear').addEventListener('click', (e) => { e.preventDefault(); $('q').value = ''; runSearch(); $('q').focus(); });
$('back').addEventListener('click', () => { if (nav.stack.length) pop(); else $('app').classList.remove('open'); });
$('list').addEventListener('scroll', () => $('lnav').classList.toggle('scrolled', $('list').scrollTop > 40), { passive: true });
function onDetailScroll() {
  const y = $('detail').scrollTop;
  $('dnav').classList.toggle('scrolled', y > 6);
  $('dnav').classList.toggle('titled', y > 90);
}
$('detail').addEventListener('scroll', onDetailScroll, { passive: true });
wide.addEventListener('change', () => { if (wide.matches && !nav.id) showStart(); });
darkMQ.addEventListener('change', () => { applyEffects(); if (nav.id) refresh(); });

// 왼쪽 가장자리에서 밀기: 하위 화면이면 한 단계 뒤로, 폰에서 맨 위 화면이면 목록으로 (손가락을 따라옴)
let drag = null;
const detailEl = $('detail');
const listEl = $('list');
detailEl.addEventListener('touchstart', (e) => {
  if (sl) return;
  const t = e.touches[0];
  const edge = t.clientX - detailEl.getBoundingClientRect().left;
  if (edge > 30) return;
  if (nav.stack.length) { drag = { mode: 'pop', x: t.clientX, y: t.clientY, dx: 0, on: false }; return; }
  if (wide.matches || !$('app').classList.contains('open')) return;
  drag = { mode: 'close', x: t.clientX, y: t.clientY, dx: 0, lastX: t.clientX, lastT: e.timeStamp, v: 0, on: false };
}, { passive: true });
detailEl.addEventListener('touchmove', (e) => {
  if (!drag) return;
  const t = e.touches[0];
  const dx = t.clientX - drag.x;
  const dy = t.clientY - drag.y;
  if (!drag.on) {
    if (Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
    if (dx < 6) return;
    drag.on = true;
    if (drag.mode === 'close') $('app').classList.add('dragging');
  }
  e.preventDefault();
  drag.dx = Math.max(0, dx);
  if (drag.mode === 'pop') {
    $('dcontent').style.transform = `translateX(${drag.dx * 0.6}px)`;
    $('dcontent').style.opacity = String(1 - Math.min(0.6, drag.dx / 600));
    return;
  }
  const dt = Math.max(1, e.timeStamp - drag.lastT);
  drag.v = (t.clientX - drag.lastX) / dt;
  drag.lastX = t.clientX;
  drag.lastT = e.timeStamp;
  detailEl.style.transform = `translateX(${drag.dx}px)`;
  listEl.style.transform = `translateX(${-30 + 30 * Math.min(1, drag.dx / window.innerWidth)}%)`;
}, { passive: false });
const endDrag = () => {
  if (!drag) return;
  if (drag.mode === 'pop') {
    $('dcontent').style.transform = '';
    $('dcontent').style.opacity = '';
    if (drag.on && drag.dx > 80) pop();
    drag = null;
    return;
  }
  const close = drag.on && (drag.dx > window.innerWidth * 0.35 || drag.v > 0.5);
  $('app').classList.remove('dragging');
  detailEl.style.transform = '';
  listEl.style.transform = '';
  if (close) $('app').classList.remove('open');
  drag = null;
};
detailEl.addEventListener('touchend', endDrag);
detailEl.addEventListener('touchcancel', endDrag);

// 두 손가락으로 확대되는 것 막기 (앱처럼 고정된 화면)
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());

// iOS에서 누를 때 눌리는 효과가 보이게
document.addEventListener('touchstart', () => {}, { passive: true });

// 인터넷 없이도 열리게: 처음 한 번 인터넷으로 열 때 파일을 기기에 저장해 둬요 (sw.js)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
